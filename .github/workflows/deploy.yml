name: Deploy

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libgmp
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: pytest tests/

  make-sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: ci-sdist
          path: dist/*.tar.gz

  make-wheels:
    name: Make Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: run-tests
    strategy:
      fail-fast: false
      matrix:
        # Windows excluded: the C kernels use C99 VLAs, which MSVC does not support
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-*
          # gmp must exist in each build env; setup.py finds it on system paths
          # (linux) or via CONDA_PREFIX (macos, pointed at brew's gmp)
          CIBW_SKIP: "*-musllinux*"
          CIBW_BEFORE_ALL_LINUX: yum install -y gmp-devel
          CIBW_BEFORE_ALL_MACOS: brew install gmp
          CIBW_ENVIRONMENT_MACOS: CONDA_PREFIX=$(brew --prefix gmp)
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: x86_64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ci-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  deploy-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [make-sdist, make-wheels]
    environment:
      name: pypi
      url: https://pypi.org/p/pfvs
    permissions:
      id-token: write
    # publishing disabled until the pfvs PyPI project exists; restore the gate
    # below (github.event_name == 'release' && github.event.action == 'published')
    if: false
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ci-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1