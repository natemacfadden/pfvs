name: CI

# Build the Fincke-Pohst kernel (fp_kernel) + Cython binding and run the test
# suite on every push and PR. CYTools is not installed here, so
# test_manwe_gvs_match_cytools skips; everything else (exact-oracle kernel
# tests, dataset reproduction, lattice primitives, Manwe physics) runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc,   python-version: "3.11"}
          - {os: ubuntu-latest, cc: gcc,   python-version: "3.12"}
          - {os: ubuntu-latest, cc: clang, python-version: "3.12"}   # Linux clang (int128 portability)
          - {os: macos-latest,  cc: clang, python-version: "3.12"}   # Apple Silicon, Apple clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install libgmp (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgmp-dev
          echo "GMP_PREFIX=/usr" >> "$GITHUB_ENV"
      - name: Install libgmp (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp
          # Homebrew's prefix (/opt/homebrew) is not on the default search path
          echo "GMP_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Build + install (with test extras)
        run: pip install -e .[test]
      - name: Build the standalone C driver (warnings are errors)
        run: make -C tests/c PREFIX="$GMP_PREFIX" CFLAGS="-O2 -Werror -Wpedantic"
      - name: Fast vs GMP exact factorization cross-check
        run: tests/c/test_factor
      - name: Run the test suite
        run: pytest tests/ -n auto
