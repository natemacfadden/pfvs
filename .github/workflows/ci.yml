name: CI

# Build the Fincke-Pohst kernel (fp_kernel) + Cython binding and run the test
# suite on every push and PR. CYTools is not installed here, so
# test_manwe_gvs_match_cytools skips; everything else (exact-oracle kernel
# tests, dataset reproduction, lattice primitives, Manwe physics) runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc,   python-version: "3.10"}
          - {os: ubuntu-latest, cc: gcc,   python-version: "3.11"}
          - {os: ubuntu-latest, cc: gcc,   python-version: "3.12"}
          - {os: ubuntu-latest, cc: gcc,   python-version: "3.13"}
          - {os: ubuntu-latest, cc: clang, python-version: "3.12"}   # Linux clang (int128 portability)
          - {os: macos-latest,  cc: clang, python-version: "3.12"}   # Apple Silicon, Apple clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install libgmp (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgmp-dev
          echo "GMP_PREFIX=/usr" >> "$GITHUB_ENV"
      - name: Install libgmp (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp
          # Homebrew's prefix (/opt/homebrew) is not on the default search path
          echo "GMP_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Build + install (with test extras)
        run: pip install -e .[test]
      - name: Build the standalone C driver (warnings are errors)
        run: make -C tests/c PREFIX="$GMP_PREFIX" CFLAGS="-O2 -Werror -Wpedantic"
      - name: Fast vs GMP exact factorization cross-check
        run: tests/c/test_factor
      - name: Run the test suite
        run: pytest tests/ -n auto

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pinned: a ruff upgrade must not change what CI enforces
      - name: Install ruff
        run: pip install ruff==0.16.6
      - name: ruff check
        run: ruff check .

  sdist:
    # The published sdist must build and pass its own tests, installed into a
    # clean environment (not run in place from the checkout).
    name: sdist builds, installs and passes its tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libgmp
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Build the sdist
        run: pipx run build --sdist --outdir dist
      - name: Install it into a fresh venv and run its tests
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.tar.gz)[test]"
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && rm -rf pfvs          # import the installed package, not the sources
          /tmp/venv/bin/python -m pytest tests -n auto

  gpu-build:
    # No GPUs on hosted runners: check that the CUDA backend compiles cleanly
    # for several architectures (tests of it run where a GPU is present).
    name: GPU backend compiles (CUDA)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: nvcc
      - name: Install nvcc (conda-forge)
        run: conda install -y -c conda-forge cuda-nvcc cuda-cudart-dev "gxx_linux-64=13"
      - name: Compile for every architecture this nvcc supports (warnings are errors)
        run: |
          supported=$(nvcc --list-gpu-arch)
          built=0
          for a in sm_70 sm_75 sm_80 sm_86 sm_89 sm_90 sm_100 sm_120; do
            echo "$supported" | grep -qx "compute_${a#sm_}" || { echo "skip $a (not in this nvcc)"; continue; }
            nvcc -arch=$a -Wno-deprecated-gpu-targets -O3 -std=c++17 -shared \
                 -Xcompiler -fPIC -Xcompiler -Wall,-Wextra,-Werror \
                 pfvs/fp_kernel/cuda/pfvs_gpu.cu -o /tmp/libpfvs_gpu_$a.so
            built=$((built + 1))
          done
          test "$built" -ge 3
